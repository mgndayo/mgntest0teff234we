<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>にんじんタワー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root{--o:#F28C28;--od:#D96E10;--g:#6FA33A;--c:#FFF3DC;--b:#4A2E1B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0d1226;overflow:hidden;touch-action:none;font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Yu Gothic",sans-serif;color:var(--b)}
#app{position:absolute;left:50%;top:50%;width:450px;height:800px;transform-origin:center;overflow:hidden}
canvas#cv{width:450px;height:800px;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000a}
.hud small{font-size:12px;opacity:.9}.hud b{font-size:34px;display:block;line-height:1}
#nx{width:74px;height:74px;background:#fff3dcd9;border-radius:14px;padding:6px;text-align:center}#nx img{max-width:100%;max-height:100%;object-fit:contain}
#nx small{color:var(--b);text-shadow:none;display:block;font-size:10px}
.ib{position:absolute;top:70px;left:12px;display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:0}
.ib button{width:38px;height:38px;border-radius:50%;background:#fff3dcd9;font-size:17px}
#rot{position:absolute;right:14px;bottom:18px;width:74px;height:74px;border-radius:50%;background:var(--o);color:#fff;font-size:34px;box-shadow:0 4px 0 var(--od)}
#rot.l{left:14px;right:auto}
#rot:active{transform:translateY(3px);box-shadow:0 1px 0 var(--od)}
.sc{position:absolute;inset:0;background:#0d1226b3;display:none;align-items:center;justify-content:center}
.sc.on{display:flex}
.pn{background:var(--c);border-radius:22px;padding:22px 20px;width:350px;max-height:740px;overflow:auto;text-align:center;box-shadow:0 8px 0 #0004}
.pn h1{margin:0 0 4px;color:var(--od);font-size:34px}.pn h2{margin:0 0 8px;color:var(--od)}
.pn p{margin:8px 0;font-size:13px;line-height:1.6}
.bt{display:block;width:100%;margin:9px 0 0;padding:13px;border-radius:14px;background:var(--o);color:#fff;font-size:18px;font-weight:700;box-shadow:0 4px 0 var(--od)}
.bt.s{background:var(--g);box-shadow:0 4px 0 #4f7a26}.bt:disabled{opacity:.5}
.big{font-size:52px;font-weight:800;color:var(--od);margin:0}
input{width:100%;padding:11px;border-radius:12px;border:2px solid var(--o);font:inherit;font-size:16px;text-align:center;background:#fff;color:var(--b);user-select:text}
.tb{display:flex;gap:6px;margin:8px 0}.tb button{flex:1;padding:8px;border-radius:10px;background:#f3dcb4}.tb .on{background:var(--o);color:#fff}
ol{list-style:none;margin:0;padding:0;text-align:left}ol li{display:flex;gap:8px;padding:7px 4px;border-bottom:1px dashed #d9b98a;font-size:15px}
ol li i{width:28px;font-style:normal;font-weight:800;color:var(--od)}ol li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>
<div id="app">
<canvas id="cv" width="900" height="1600"></canvas>
<div class="hud"><div><small>高さ</small><b id="sc">0.00m</b><small id="bs"></small></div><div id="nx"><small>NEXT</small><img id="nxi" alt=""></div></div>
<div class="ib"><button id="mu">🔊</button><button id="pa">⏸</button><button id="sd" title="回転ボタンの位置">⇄</button></div>
<button id="rot">↻</button>
<div class="sc on" id="ti"><div class="pn"><h1>にんじんタワー</h1><p>落として、高く積もう!<br>ドラッグで位置を決めて、指を離すと落下<br>↻ボタンで回転(PCは←→↑と Space)<br><b>にんじんから落ちたら即終了</b></p><button class="bt" id="st">スタート</button><button class="bt s" id="rk1">ランキング</button></div></div>
<div class="sc" id="ov"><div class="pn"><h2>ゲームオーバー</h2><p class="big" id="os"></p><p id="ob"></p><input id="nm" maxlength="10" placeholder="なまえ(10文字まで)"><button class="bt" id="rg">ランキングに登録</button><p id="rm" style="margin:4px 0;font-size:12px"></p><button class="bt s" id="sh">画像でシェア</button><button class="bt" id="rt">もう一度</button><button class="bt s" id="rk2">ランキング</button></div></div>
<div class="sc" id="pz"><div class="pn"><h2>⏸ 停止中</h2><p>ゲームは止まっています</p><button class="bt" id="rs">再開</button></div></div>
<div class="sc" id="rl"><div class="pn"><h2>ランキング</h2><div class="tb"><button id="t1" class="on">みんなの記録</button><button id="t2">この端末</button></div><ol id="ls"></ol><button class="bt" id="cl">閉じる</button></div></div>
</div>

const FRICTION=2;          // P0001 摩擦係数(Matter.jsの標準は0.1。1で十分high)
const FRICTION_STATIC=5;   // P0001 静止摩擦
const AIR=.04;             // 空気抵抗(Matter標準。大きいほど落下がゆっくりになる)

const KEEP_DYNAMIC=99;     // 案1改: 直近この個数だけ動かし、それより古い落ち着いたキャラは即固定(0で全固定、99で無効)
const DROP_FREEZE_SPEED=1;  // 案1追加: 新しく落とす瞬間、速度がこれ未満のキャラは全部固定(じわじわ動いている途中でも固定。大きいほど多く固定、0で無効)
const FREEZE_DEPTH=80;     // 案1: キャラの上端が頂点からこの距離(px)より下なら固定。キャラ1個≒47〜76px。大きい=自然/小さい=安定。9999で無効
const DENS_FALL=900;       // 案2: 高さがこの値(px)に近づくほど新しいキャラを軽くする。大きい=変化がゆるやか。0で無効
const DENS_MIN=.35;        // 案2: 密度倍率の下限
const INERTIA_K=2.5;       // 案3: 回転しにくさ(1で従来どおり)
const W=450,H=800,PX=225,PY=630,SZ=76;
const {Engine,Bodies,Body,Composite,Vertices}=Matter;
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');ctx.scale(2,2);
const ld=s=>{const i=new Image();i.src=s;return i};
const IM=A.imgs.map(ld),BG=ld(A.bg),BB=ld(A.baseBody),BL=ld(A.baseLeaf),BS=A.base;
const P=A.polys.map((p,i)=>{const ar=A.ar[i],w=ar<=1?SZ:SZ/ar,h=w*ar;return{w,h,v:p.map(q=>q.map(([x,y])=>({x:x*w,y:y*h})))}});
const mk=(i,d)=>Bodies.fromVertices(0,0,P[i].v,{density:d,friction:FRICTION/*P0001*/,frictionStatic:FRICTION_STATIC/*P0001*/,restitution:0,frictionAir:AIR});
P.forEach(q=>{const c=Vertices.centre(q.v[0]);q.cx=c.x;q.cy=c.y});
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const fm=c=>(c/100).toFixed(2)+'m',rnd=(a,b)=>a+Math.random()*(b-a);
let sc=1,st='title',eng,bodies,hov,cur,nxt,bag=[],px=PX,ang=0,cam=0,camT=0,cd=0,runMax=0,combo=0,lastX=PX,tops=[],fx=[],pop=[],seen=ls('ninjin_seen',false),best=ls('ninjin_best',0),reg=false,mute=false,ac,acc=0,last=0,T=0;
function fit(){sc=Math.min(innerWidth/W,innerHeight/H);$('app').style.transform=`translate(-50%,-50%) scale(${sc})`}addEventListener('resize',fit);fit();
// 効果音
function snd(f,d=.12,t='sine',v=.15,s=0,w=0){if(mute)return;try{ac=ac||new(window.AudioContext||webkitAudioContext)();const n=ac.currentTime+w,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const fan=()=>[523,659,784,1047].forEach((f,i)=>snd(f,.18,'square',.07,0,i*.09));
// ゲーム進行
const nextI=()=>{if(!bag.length){bag=[0,1,2,3,4,5,6,7];bag.sort(()=>Math.random()-.5)}return bag.pop()};
function reset(){eng=Engine.create({positionIterations:14,velocityIterations:12});eng.gravity.y=1.15;bodies=[];
 {const ox=PX-BS.cx,oy=PY-BS.top;const base=Body.create({isStatic:true,friction:FRICTION/*P0001*/,frictionStatic:FRICTION_STATIC/*P0001*/,restitution:0,parts:BS.strips.map(p=>{const v=p.map(([x,y])=>({x,y})),c=Vertices.centre(v);return Bodies.fromVertices(ox+c.x,oy+c.y,[v],{friction:FRICTION/*P0001*/,frictionStatic:FRICTION_STATIC/*P0001*/,restitution:0})})});
 // Matter.jsはisStatic:trueにすると全パーツのfrictionを強制的に1へ上書きする。生成後に戻さないと、FRICTIONを上げても土台との摩擦は1のまま(相手側との摩擦はmin()で決まる)
 base.parts.forEach(p=>{p.friction=FRICTION;p.frictionStatic=FRICTION_STATIC});Composite.add(eng.world,base)}
 cam=camT=0;runMax=0;combo=0;lastX=PX;fx=[];pop=[];px=PX;ang=0;reg=false;tops.forEach(t=>t.done=false);
 cur=nextI();nxt=nextI();hov=cur;cd=0;showNx();$('sc').textContent=fm(0);$('bs').textContent='ベスト '+fm(best)}
function showNx(){$('nxi').src=A.imgs[nxt]}
function start(){snd(500,.1,'triangle');reset();['ti','ov','rl','pz'].forEach(x=>$(x).classList.remove('on'));st='play';loadTops()}
function drop(){if(st!=='play'||hov===null||T<cd)return;bodies.forEach(o=>{if(!o.frozen&&Math.hypot(o.velocity.x,o.velocity.y)<DROP_FREEZE_SPEED)fz(o)});const p=P[hov],b=mk(hov,DENSITY*(DENS_FALL?Math.max(DENS_MIN,1-runMax/DENS_FALL):1));Body.setInertia(b,b.inertia*INERTIA_K);
 Body.setPosition(b,{x:px,y:cam+110});Body.setAngle(b,ang);b.sp=p;b.im=IM[hov];b.calm=0;b.t0=T;Composite.add(eng.world,b);bodies.push(b);snd(320,.1,'triangle',.2,-140);
 seen=true;sv('ninjin_seen',true);hov=null;cd=T+800;setTimeout(()=>{if(st==='play'){cur=nxt;nxt=nextI();hov=cur;ang=0;showNx()}},800)}
const rot=()=>{if(st==='play'){ang+=Math.PI/4;snd(700,.05,'square',.05)}};
function fz(b){Body.setStatic(b,true);b.frozen=true;b.parts.forEach(q=>{q.friction=FRICTION;q.frictionStatic=FRICTION_STATIC})}
function settle(b){if(b.bounds.min.y>PY)return;snd(200,.08,'sine',.15)}
function step(){Engine.update(eng,1000/120);Engine.update(eng,1000/120);let hMax=0;
 for(const b of bodies){let sp=Math.hypot(b.velocity.x,b.velocity.y);if(sp>30)Body.setVelocity(b,{x:b.velocity.x*30/sp,y:b.velocity.y*30/sp});/*すり抜け防止の緩い安全上限(通常プレイでは効かない)*/b.calm=sp<.25&&Math.abs(b.angularVelocity)<.02?b.calm+1:0;
  if(!b.set&&b.calm>25){b.set=true;settle(b)}
  if(b.set&&!b.frozen&&b.calm>40&&(bodies.length-bodies.indexOf(b)>KEEP_DYNAMIC||b.bounds.min.y-(PY-runMax)>FREEZE_DEPTH)){Body.setStatic(b,true);b.frozen=true;b.parts.forEach(q=>{q.friction=FRICTION;q.frictionStatic=FRICTION_STATIC})}/*案1: 下の層を固定。setStaticが摩擦を1に戻すので再設定*/
  if(b.calm>15)hMax=Math.max(hMax,PY-b.bounds.min.y);
  if(b.bounds.min.y>PY+(BS.bot-BS.top)+40){over();return}}
 if(hMax>runMax){runMax=hMax;$('sc').textContent=fm(runMax);
  tops.forEach((t,i)=>{if(!t.done&&runMax>t.score){t.done=true;celebrate(i)}})}
 camT=Math.min(0,-(runMax+ (bodies.length?0:0))+ (PY-330));if(runMax<330)camT=0;else camT=-(runMax-(PY-330-(-0)))+0;camT=Math.min(0,-(runMax-330))}
function over(){if(st!=='play')return;st='over';dg=out=false;snd(300,.5,'sawtooth',.12,-220);hov=null;best=Math.max(best,runMax);sv('ninjin_best',best);
 setTimeout(()=>{$('os').textContent=fm(runMax);$('ob').textContent='ベスト '+fm(best);$('nm').value=ls('ninjin_name','');$('rg').disabled=runMax<1;$('rg').textContent='ランキングに登録';$('rm').textContent=DB_URL?'':'(オンライン未設定:この端末に保存されます)';$('ov').classList.add('on')},1000)}

function celebrate(i){fan();const cols=['#F28C28','#6FA33A','#fff','#ffd54a','#ff7a7a'];
 const add=(x,y,vx,vy)=>fx.push({x,y,vx,vy,c:cols[Math.random()*5|0],r:rnd(3,6),l:rnd(80,150),a:rnd(0,6)});
 if(i===0){for(let k=0;k<150;k++)add(PX+rnd(-30,30),260,rnd(-5,5),rnd(-7,1));fx.push({kusu:1,l:110,x:PX,y:230});pop.push({x:PX,y:0,t:T,s:'🎉 1位超え!! 🎉',sc:1,long:1})}
 else{for(let k=0;k<45;k++){add(10,H-60,rnd(2,9),rnd(-13,-6));add(W-10,H-60,rnd(-9,-2),rnd(-13,-6))}pop.push({x:PX,y:0,t:T,s:`${i+1}位超え!`,sc:1,long:1})}}
