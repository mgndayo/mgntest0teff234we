<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>カレーキャッチャー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#161A34;
    --navy-mid:#232a55;
    --gold:#F4A825;
    --gold-soft:#FFD37A;
    --curry-brown:#8B4A24;
    --cream:#FBEEDD;
    --danger:#E4572E;
    --life-empty: rgba(251,238,221,0.25);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    background:var(--navy-deep);
    font-family:'M PLUS Rounded 1c', sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    overscroll-behavior:none;
    touch-action:none;
    color:var(--cream);
  }
  #wrap{
    position:relative; width:100%; height:100%;
    background: var(--navy-deep);
    overflow:hidden;
  }
  /* ゲーム画面は全デバイス共通の固定サイズ(450x800, 9:16)。
     画面の大きさに合わせてscaleで拡大縮小するだけなので、
     iPhone / Android / iPad / PC のどれでも同じ広さ・同じ条件で遊べる。 */
  #gameArea{
    position:absolute; left:50%; top:50%;
    width:450px; height:800px;
    transform: translate(-50%,-50%);
    transform-origin: center center;
    background: radial-gradient(120% 90% at 50% -10%, #303a72 0%, var(--navy-deep) 60%);
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.55);
  }
  canvas{display:block; width:100%; height:100%;}
  .pauseBtn, .muteBtn{
    position:absolute; z-index:6; pointer-events:auto; cursor:pointer;
    background:rgba(22,26,52,0.78); border:2px solid rgba(244,168,37,0.55);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--cream); box-shadow:0 3px 0 rgba(0,0,0,0.28); user-select:none;
  }
  .pauseBtn{
    right:14px; bottom:14px;
    width:46px; height:46px; font-size:20px;
  }
  .muteBtn{
    left:14px; bottom:14px;
    width:40px; height:40px; font-size:16px;
  }
  .pauseBtn:active, .muteBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.28); }

  .hud{
    position:absolute; top:14px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:0 14px; pointer-events:none; z-index:5;
  }
  .chip{
    background:rgba(22,26,52,0.72); border:2px solid rgba(244,168,37,0.55);
    border-radius:16px; padding:6px 14px; font-weight:700; font-size:15px;
    backdrop-filter: blur(3px);
    box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  .chip small{display:block; font-size:10px; font-weight:500; opacity:0.75; letter-spacing:0.02em;}
  .hearts{display:flex; gap:4px; margin-top:2px;}
  .heart{width:14px;height:14px;}

  .overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(12,14,30,0.72); z-index:10; padding:24px;
  }
  .panel{
    background:var(--cream); color:#2a2013; border-radius:24px; padding:28px 26px;
    max-width:340px; width:100%; text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,0.28);
    max-height:100%; overflow-y:auto;
  }
  .panel h1{
    font-size:26px; margin:0 0 6px; font-weight:800; color:var(--curry-brown);
  }
  .panel p{ font-size:14px; line-height:1.7; margin:10px 0; }
  .panel .stat{ font-size:15px; font-weight:700; margin:4px 0; color:var(--curry-brown);}
  .rule{display:flex; align-items:center; gap:10px; text-align:left; font-size:13px; margin:8px 0;}
  .rule img{width:34px; height:auto; flex-shrink:0;}
  btn, .btn{
    display:inline-block; margin-top:14px; padding:13px 30px; border:none; border-radius:999px;
    background:var(--gold); color:#2a2013; font-weight:800; font-size:16px;
    font-family:inherit; box-shadow:0 4px 0 #b97d13; cursor:pointer;
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #b97d13; }
  .sub{font-size:11px; opacity:0.6; margin-top:10px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="gameArea">
  <canvas id="c"></canvas>

  <div class="hud" id="hud" style="display:none;">
    <div class="chip">SCORE<small id="scoreLabel"></small>
      <div id="scoreVal" style="font-size:20px;">0</div>
    </div>
    <div class="chip" style="text-align:center;">
      <div id="heartsRow" class="hearts"></div>
      <small style="opacity:0.8;">STAGE <span id="stageVal">1</span></small>
    </div>
  </div>

  <div class="overlay" id="titleScreen">
    <div class="panel">
      <h1>カレーキャッチャー</h1>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // ゲーム内の論理サイズは全デバイス共通。アイテムの大きさ・落下速度・
  // キャラの動ける幅がすべて同じになるので、端末による有利不利が出ない。
  const W = 450, H = 800;
  const wrapEl = document.getElementById('wrap');
  const gameArea = document.getElementById('gameArea');
  function resize(){
    const availW = wrapEl.clientWidth, availH = wrapEl.clientHeight;
    if(!availW || !availH) return;
    const s = Math.min(availW / W, availH / H);
    gameArea.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
    // 見た目がぼやけないよう、表示倍率と端末の解像度に合わせて描画解像度を決める
    const bs = Math.min(s * (window.devicePixelRatio || 1), 3);
    canvas.width = Math.round(W * bs);
    canvas.height = Math.round(H * bs);
    ctx.setTransform(bs, 0, 0, bs, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => { setTimeout(resize, 120); setTimeout(resize, 400); });
  if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(wrapEl);

  // ---- audio (効果音のみ) ----
  let audioCtx = null;
  function ensureAudioContext(){

    }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }
  function playTone(freqStart, freqEnd, duration, type, volume){
    if(muted || !audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freqStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd), t0+duration);
    gain.gain.setValueAtTime(volume||0.2, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+duration);
  }

  function mergeIntervals(intervals){
    if(!intervals.length) return [];
    const s = intervals.slice().sort((a,b)=>a[0]-b[0]);
    const merged=[s[0].slice()];
    for(let i=1;i<s.length;i++){

      const gap = largestFreeGap(blocked, W);
      if(hayashiStreak > 2 || gap.width < safetyGap){
        type = 'curry';
        hayashiStreak = 0;
      }
    } else {
      hayashiStreak = 0;
    }

    const speed = (115 + stage*13) * (0.85+Math.random()*0.3);
    items.push({type, x, y:-r, r, speed, state:'fall', animT:0, rot:(Math.random()-0.5)*0.3});
  }

  function update(dt){
    elapsed += dt;
    const newStage = 1 + Math.floor(elapsed/14);
    if(newStage !== stage){ stage = newStage; }

    healSince += dt;
    if(life >= MAX_LIFE){
      healPending = false;
    } else if(!healPending && healSince >= HEAL_MIN_INTERVAL && Math.random() < HEAL_CHANCE_PER_SEC * dt){
      healPending = true;
    }

    charX += (charTargetX - charX) * Math.min(1, dt*10);
    const half = charSize()*0.42;
    charX = Math.max(half, Math.min(W-half, charX));

    spawnTimer -= dt;
    const interval = Math.max(0.42, 0.95 - stage*0.045);
    if(spawnTimer <= 0){ spawnItem(); spawnTimer = interval; }

    const mouth = charMouth();
    const hit = faceHit();

    for(const it of items){
      if(it.state === 'fall'){
        it.y += it.speed*dt;
        const dx = it.x-hit.x, dy = it.y-hit.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < hit.r + it.r*0.55){
          if(it.type === 'hayashi'){
            it.state='miss'; it.animT=0;
            life -= 1; shakeT = 0.35;
            playHitSound();
            if(life <= 0){ life = 0; setTimeout(()=>gameOver(), 260); }
          } else if(it.type === 'heal'){
            it.state='eat'; it.animT=0; it.fromX=it.x; it.fromY=it.y;
            life = Math.min(MAX_LIFE, life+1);
            score += 5;
            chompT = 0.22;
            playHealSound();
          } else {
            it.state='eat'; it.animT=0; it.fromX=it.x; it.fromY=it.y;
            score += (it.type==='gold') ? 30 : 10;
            chompT = 0.22;
            playEatSound();
          }
        } else if(it.y - it.r > H){
          it.state='gone';
        }
      } else if(it.state === 'eat'){
        it.animT += dt/0.28;
        const t = Math.min(1, it.animT);
        it.x = it.fromX + (mouth.x-it.fromX)*t;
        it.y = it.fromY + (mouth.y-it.fromY)*t;
        if(t>=1) it.state='gone';
      } else if(it.state === 'miss'){
        it.animT += dt/0.4;
        it.y += it.speed*0.6*dt;
        if(it.animT>=1) it.state='gone';
      }
    }
    items = items.filter(it => it.state !== 'gone');
    if(chompT>0) chompT -= dt;
    if(shakeT>0) shakeT -= dt;
  }

  function drawFood(it){
    ctx.save();
    const scale = it.state==='eat' ? Math.max(0,1-it.animT) : 1;
    const alpha = it.state==='miss' ? Math.max(0,1-it.animT) : 1;
    ctx.globalAlpha = alpha;
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot + (it.state==='miss'? it.animT*2:0));
    ctx.scale(scale, scale);
    const img = it.type==='hayashi' ? imgHayashi : imgCurry;
    if(it.type==='gold'){
      ctx.filter = 'sepia(1) saturate(6) hue-rotate(-15deg) brightness(1.15)';
      ctx.shadowColor = 'rgba(244,168,37,0.9)';
      ctx.shadowBlur = 22;
    } else if(it.type==='heal'){
      ctx.filter = 'hue-rotate(85deg) saturate(1.8) brightness(1.08)';
      ctx.shadowColor = 'rgba(120,224,150,0.95)';
      ctx.shadowBlur = 22;
    }
    const d = it.r*2;
    if(img.complete) ctx.drawImage(img, -d/2, -d*0.34, d, d*0.72);
    ctx.restore();
    if(it.type==='heal' && alpha>0.05){
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(it.x, it.y - it.r*0.55);
      ctx.fillStyle = '#ff6b81';
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.5;
      const hs = it.r*0.30;
      ctx.beginPath();
      ctx.moveTo(0, hs*0.7);
      ctx.bezierCurveTo(hs, -hs*0.4, hs*1.6, hs*0.7, 0, hs*1.6);
      ctx.bezierCurveTo(-hs*1.6, hs*0.7, -hs, -hs*0.4, 0, hs*0.7);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawChar(){
    const s = charSize();
    const squish = chompT>0 ? 1 + (chompT/0.22)*0.10 : 1;
    let sx = charX + (shakeT>0 ? (Math.random()-0.5)*10 : 0);
    ctx.save();
    ctx.translate(sx, charY());
    ctx.scale(squish, 1/squish*1);
    if(imgChar.complete) ctx.drawImage(imgChar, -s/2, -s/2, s, s);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // soft floor glow
    const g = ctx.createRadialGradient(W/2, H, 10, W/2, H, W*0.8);
    g.addColorStop(0,'rgba(244,168,37,0.10)');
    g.addColorStop(1,'rgba(244,168,37,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    for(const it of items) drawFood(it);
    drawChar();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-last)/1000); last = now;
    if(state==='playing'){ update(dt); }
    draw();
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('stageVal').textContent = stage;
    renderHearts();
    requestAnimationFrame(loop);
  }

  function renderHearts(){
    const row = document.getElementById('heartsRow');
    let html='';
    for(let i=0;i<MAX_LIFE;i++){
      html += `<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2.4 4.5 6 4.2c2-.2 3.7 1 6 3.3 2.3-2.3 4-3.5 6-3.3 3.6.3 5.5 3.8 4 7.5C19.5 16.4 12 21 12 21z" fill="${i<life?'#F4A825':'none'}" stroke="${i<life?'#F4A825':'rgba(251,238,221,0.35)'}" stroke-width="2"/></svg>`;
    }
    row.innerHTML = html;
  }

  function gameOver(){
    state='gameover';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalStage').textContent = stage;
    document.getElementById('hud').style.display='none';
    document.getElementById('pauseBtn').style.display='none';
    document.getElementById('muteBtn').style.display='none';
    document.getElementById('gameoverScreen').style.display='flex';
    playClearSound();
  }

  function startGame(){
    resetGame();
    state='playing';
    document.getElementById('titleScreen').style.display='none';
    document.getElementById('gameoverScreen').style.display='none';
    document.getElementById('pauseScreen').style.display='none';
    document.getElementById('hud').style.display='flex';
    document.getElementById('pauseBtn').style.display='flex';
    document.getElementById('muteBtn').style.display='flex';
    ensureAudioContext();
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  // iOSなど一部ブラウザ対策: タップ系イベントで効果音用のAudioContextを起こしておく
  function unlockAudioOnGesture(){
    ensureAudioContext();
  }
  document.addEventListener('touchend', unlockAudioOnGesture, {passive:true});
  document.addEventListener('pointerdown', unlockAudioOnGesture);

  function pauseGame(){
    if(state !== 'playing') return;
    state = 'paused';
    document.getElementById('pauseScreen').style.display = 'flex';
  }
  function resumeGame(){
    if(state !== 'paused') return;
    state = 'playing';
    document.getElementById('pauseScreen').style.display = 'none';
    last = performance.now();
  }
  document.getElementById('pauseBtn').addEventListener('click', pauseGame);
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && state==='playing') pauseGame();
  });
  document.getElementById('muteBtn').addEventListener('click', ()=>{
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '\ud83d\udd07' : '\ud83d\udd0a';
  });

  function pointerX(e){
    const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * W;
  }
  canvas.addEventListener('touchstart', e=>{ dragging=true; charTargetX = pointerX(e); }, {passive:true});
  canvas.addEventListener('touchmove', e=>{ if(dragging) charTargetX = pointerX(e); }, {passive:true});
  canvas.addEventListener('touchend', ()=>{ dragging=false; }, {passive:true});
  canvas.addEventListener('mousedown', e=>{ dragging=true; charTargetX = pointerX(e); });
  window.addEventListener('mousemove', e=>{ if(dragging) charTargetX = pointerX(e); });
  window.addEventListener('mouseup', ()=>{ dragging=false; });

  charX = W/2; charTargetX = charX;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
